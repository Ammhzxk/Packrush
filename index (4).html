<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PackRush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&family=Chivo+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky scoreboard header, yard-line tabs, main stage left, live chat rail right. Boldness lives in the card foil and rarity glow only. */
:root{
  --ink:#0d1424; --ink-2:#131d33; --ink-3:#1b2845; --line:#2b3b61;
  --chalk:#f2efe4; --chalk-dim:#a9b2c8; --gold:#f2b632; --gold-ink:#1b1403;
  --good:#4cc38a; --bad:#ff6b6b;
  --r-common:#8e99b3; --r-uncommon:#4cc38a; --r-rare:#4aa3ff; --r-epic:#a66cff; --r-legendary:#ffb02e; --r-mythic:#ff4d6d;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Chivo Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--chalk);font:15px/1.45 var(--f-body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink-2);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
.shell{max-width:1320px;margin:0 auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--ink-2);border:1px solid var(--line);border-bottom:3px solid var(--gold);border-radius:0 0 10px 10px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:20px}
.brand-name{font:900 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.wallet{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:7px;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 8px;font:700 15px var(--f-mono)}
.ico{width:20px;height:20px;flex:none}
.luck{border:1px solid var(--line);background:var(--ink);border-radius:999px;padding:6px 14px;font:800 15px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim)}
.luck small{font:500 12px var(--f-mono);letter-spacing:0;text-transform:none;margin-left:4px}
.luck.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--chalk-dim)}
.ghost:hover{color:var(--chalk);border-color:var(--chalk-dim)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 18px;font:800 21px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--chalk-dim);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--chalk)}
.tab-live{display:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:6px}

.field{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;padding-top:20px}
.stage{min-width:0;container-type:inline-size}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;height:calc(100vh - 192px);min-height:440px;display:flex;flex-direction:column;background:var(--ink-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (max-width:960px){
  .field{grid-template-columns:minmax(0,1fr)}
  .rail{display:none;position:static;height:72vh}
  body[data-tab="live"] .rail{display:flex}
  body[data-tab="live"] .stage{display:none}
  .tab-live{display:block}
}

.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font:900 38px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.sub{color:var(--chalk-dim);font-size:14px}
.btn{border:1px solid var(--line);background:var(--ink-3);padding:9px 15px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.gold:hover:not(:disabled){filter:brightness(1.08)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#190808}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tools input[type=search],.tools select,.field-in{background:var(--ink-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.tools input[type=search]{flex:1 1 180px}
.chk{display:flex;align-items:center;gap:6px;color:var(--chalk-dim);font-size:14px}
.strip{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.strip b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.05em}

/* packs */
.packs{display:grid;grid-template-columns:1fr;gap:0 32px}
@container (min-width:720px){.packs{grid-template-columns:1fr 1fr}}
.pack{display:grid;grid-template-columns:132px minmax(0,1fr);gap:20px;padding:22px 0;border-top:1px solid var(--line)}
.pack-art{--p1:#333;--p2:#111;width:132px;aspect-ratio:3/4.3;position:relative;border-radius:7px;background:linear-gradient(160deg,var(--p1),var(--p2));transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;box-shadow:0 16px 30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.14);display:grid;place-items:center;align-content:center;gap:4px;overflow:hidden;text-align:center;color:#fff}
.pack-art.tilting{transition:transform .04s linear}
.pack-art::before,.pack-art::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 2px,rgba(0,0,0,.32) 2px 4px);z-index:2}
.pack-art::before{top:0}.pack-art::after{bottom:0}
.pa-band{position:absolute;left:-12%;right:-12%;top:40%;height:27%;background:rgba(0,0,0,.34);transform:rotate(-9deg);border-block:2px solid rgba(255,255,255,.55)}
.pa-bolt{position:relative;width:34px;height:34px;color:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4));transform:rotate(-9deg)}
.pack-art b{position:relative;font:900 27px/.92 var(--f-display);font-style:italic;text-transform:uppercase;transform:rotate(-9deg);padding:0 6px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.pa-shine{position:absolute;inset:0;z-index:1;background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.38) 48%,transparent 60%);transform:translateX(-130%);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.pack h3{font:900 28px/1 var(--f-display);font-style:italic;text-transform:uppercase;letter-spacing:.03em}
.pack .note{color:var(--chalk-dim);font-size:14px;margin:3px 0 8px}
.odds{display:flex;flex-wrap:wrap;gap:3px 12px;font:500 12px var(--f-mono);margin-bottom:12px}
.odds li{display:flex;align-items:center;gap:5px}
.odds li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rc);box-shadow:0 0 6px var(--rc)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stock{font:500 12px var(--f-mono);color:var(--chalk-dim)}
.old{text-decoration:line-through;color:var(--chalk-dim);font-size:12px}

/* cards */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.cardw{container-type:inline-size;width:100%;--rx:0deg;--ry:0deg;transition:transform .2s}
.card{--rc:var(--r-common);--frame:linear-gradient(145deg,#b4bdd1,#59627c);position:relative;width:100%;aspect-ratio:5/7;border-radius:6cqw;background:var(--frame);transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s ease-out;box-shadow:0 2.5cqw 6cqw rgba(0,0,0,.55);color:var(--chalk)}
.cardw.tilting .card{transition:transform .04s linear}
.r-uncommon{--rc:var(--r-uncommon);--frame:linear-gradient(145deg,#8ff0bd,#1d7a50)}
.r-rare{--rc:var(--r-rare);--frame:linear-gradient(145deg,#a2d0ff,#1b5cb0)}
.r-epic{--rc:var(--r-epic);--frame:linear-gradient(145deg,#d6b8ff,#5427a6);box-shadow:0 2.5cqw 6cqw rgba(0,0,0,.55),0 0 8cqw color-mix(in srgb,var(--rc) 45%,transparent)}
.r-legendary{--rc:var(--r-legendary);--frame:linear-gradient(135deg,#fff3b8,#f2b632 35%,#9c5f08 65%,#ffe07a);box-shadow:0 2.5cqw 6cqw rgba(0,0,0,.55),0 0 10cqw color-mix(in srgb,var(--rc) 60%,transparent)}
.r-mythic{--rc:var(--r-mythic);--frame:conic-gradient(from var(--ang),#ff4d6d,#ffb02e,#ffee77,#4cc38a,#4aa3ff,#a66cff,#ff4d6d);box-shadow:0 2.5cqw 6cqw rgba(0,0,0,.55),0 0 12cqw color-mix(in srgb,var(--rc) 70%,transparent)}
.tile:hover .r-mythic,.cardw.live .r-mythic{animation:angspin 4s linear infinite}
@keyframes angspin{to{--ang:360deg}}
.cf{position:absolute;inset:2.4cqw;border-radius:4.2cqw;overflow:hidden;background:#0b1224;display:flex;flex-direction:column;isolation:isolate}
.c-art{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(165deg,var(--t2),var(--t1) 72%)}
.c-art::before{content:"";position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 80%,rgba(255,255,255,.13) 0 7deg,transparent 7deg 18deg)}
.c-art::after{content:"";position:absolute;left:50%;bottom:-12%;width:95%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 60%,transparent),transparent 65%)}
.c-bigno{position:absolute;left:0;right:0;top:4%;text-align:center;font:900 66cqw/1 var(--f-display);font-style:italic;color:transparent;-webkit-text-stroke:.7cqw rgba(255,255,255,.3);z-index:0}
.bust{position:absolute;left:50%;bottom:-1%;width:88%;transform:translateX(-50%);z-index:1;filter:drop-shadow(0 1cqw 1.6cqw rgba(0,0,0,.5))}
.b-j{fill:var(--t1);stroke:rgba(255,255,255,.25);stroke-width:.8}
.b-tl{stroke:var(--t2)}
.b-fill1{fill:var(--t1)}.b-fill2{fill:var(--t2)}
.b-n{font:900 22px 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;font-style:italic;fill:var(--t2);stroke:rgba(0,0,0,.45);stroke-width:.8;paint-order:stroke}
.c-ovr{position:absolute;left:3cqw;top:3cqw;z-index:3;display:grid;justify-items:center;background:rgba(6,10,22,.76);border:.5cqw solid var(--rc);border-radius:2.4cqw;padding:1.4cqw 2.4cqw 1.2cqw;min-width:14cqw}
.c-ovr b{font:900 14cqw/.9 var(--f-display);color:var(--rc)}
.c-ovr span{font:700 5.4cqw/1.1 var(--f-display);letter-spacing:.12em;color:var(--chalk-dim)}
.c-sport{position:absolute;right:3cqw;top:3cqw;z-index:3;width:11cqw;height:11cqw;border-radius:50%;background:rgba(6,10,22,.76);border:.5cqw solid var(--rc);display:grid;place-items:center}
.c-sport svg{width:68%;height:68%;color:var(--chalk)}
.c-foilchip{position:absolute;right:3cqw;top:16cqw;z-index:3;font:800 5cqw/1 var(--f-display);letter-spacing:.14em;background:linear-gradient(90deg,#ff5fa0,#ffd45f,#5ff0c0,#5f9bff);color:#0b1224;padding:.8cqw 1.8cqw;border-radius:1.4cqw}
.c-plate{position:relative;z-index:3;padding:2.6cqw 4cqw 3.2cqw;background:linear-gradient(180deg,#101a33,#0a1124);border-top:.8cqw solid var(--rc)}
.c-name{font:900 11cqw/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{display:flex;align-items:center;gap:2cqw;margin-top:1.4cqw;font:600 5.2cqw/1 var(--f-body);color:var(--chalk-dim);white-space:nowrap;overflow:hidden}
.c-cc{font:700 4.8cqw/1 var(--f-mono);background:rgba(255,255,255,.12);padding:.8cqw 1.6cqw;border-radius:1.2cqw;color:var(--chalk);flex:none}
.c-tm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.c-rn{margin-left:auto;flex:none;font:800 5.4cqw/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--rc)}
.c-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:3cqw;margin-top:2.4cqw}
.c-stat{display:grid;gap:1cqw;font:600 4.6cqw/1 var(--f-mono);color:var(--chalk-dim)}
.c-stat b{color:var(--chalk);font-weight:700}
.c-stat i{display:block;height:1.3cqw;border-radius:1cqw;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.c-stat i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--rc)}
.c-holo,.c-shine,.c-glare{position:absolute;inset:0;pointer-events:none}
.c-holo{z-index:4;opacity:0;mix-blend-mode:color-dodge;background:linear-gradient(115deg,transparent 15%,rgba(255,60,140,.55) 30%,rgba(255,225,90,.55) 42%,rgba(60,255,190,.55) 54%,rgba(80,140,255,.55) 66%,transparent 85%);background-size:250% 250%;background-position:var(--mx,40%) var(--my,40%)}
.r-epic .c-holo,.r-legendary .c-holo,.r-mythic .c-holo{opacity:.3}
.foil .c-holo{opacity:.6}
.cardw.live .c-holo,.tile:hover .c-holo{animation:holoidle 5s ease-in-out infinite}
.cardw.tilting .c-holo{animation:none!important}
@keyframes holoidle{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.c-glare{z-index:6;opacity:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.34),transparent 52%)}
.cardw.tilting .c-glare{opacity:1}
.c-shine{z-index:5;display:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.4) 50%,transparent 62%);transform:translateX(-130%)}
.r-legendary .c-shine,.r-mythic .c-shine{display:block}
.cardw.live .c-shine,.tile:hover .c-shine{animation:sheen 3.6s ease-in-out infinite}
.spk{position:absolute;z-index:2;width:4cqw;height:4cqw;border-radius:50%;background:radial-gradient(circle,#fff,transparent 70%);opacity:0}
.cardw.live .spk,.tile:hover .spk{animation:twinkle 2.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
.card.dim{filter:grayscale(1) brightness(.55);opacity:.55}
.card.dim .bust{filter:brightness(0) opacity(.6)}
.card.dim .c-ovr,.card.dim .c-holo{display:none}
.newb{position:absolute;top:-7px;left:-7px;z-index:8;background:var(--good);color:#04180e;font:800 12px var(--f-mono);padding:2px 8px;border-radius:999px;transform:rotate(-8deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* reveal */
.revpack{display:grid;place-items:center;padding:34px 0 40px;position:relative}
.revpack .pack-art{width:176px;animation:charge 1.3s ease-in forwards}
.revpack.ripped .pack-art{animation:ripout .32s ease-out forwards}
@keyframes charge{0%{transform:translateX(0) rotate(0) scale(1);filter:drop-shadow(0 0 0 var(--tease))}
 12%{transform:translateX(-3px) rotate(-1.5deg)}24%{transform:translateX(3px) rotate(1.5deg)}
 36%{transform:translateX(-5px) rotate(-3deg) scale(1.04)}48%{transform:translateX(5px) rotate(3deg)}
 60%{transform:translateX(-7px) rotate(-4deg) scale(1.08)}72%{transform:translateX(7px) rotate(4deg)}
 86%{transform:translateX(-9px) rotate(-6deg) scale(1.13)}100%{transform:translateX(0) rotate(0) scale(1.2);filter:drop-shadow(0 0 46px var(--tease))}}
@keyframes ripout{from{transform:scale(1.2);opacity:1}to{transform:scale(2.1);opacity:0;filter:blur(6px)}}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,150px));gap:16px;justify-content:center;margin:18px 0;perspective:1000px}
.slot{position:relative;aspect-ratio:5/7;background:none;border:0;padding:0;opacity:0;animation:deal .55s cubic-bezier(.2,.9,.3,1.15) forwards;animation-delay:calc(var(--i)*.11s)}
@keyframes deal{from{opacity:0;transform:translateY(-130px) scale(.35) rotate(-14deg)}to{opacity:1;transform:none}}
.flipper{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1.1)}
.slot.flipped .flipper{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.fr{transform:rotateY(180deg)}
.face.bk{border-radius:6%;border:2px solid rgba(242,182,50,.75);display:grid;place-items:center;color:var(--gold);background:repeating-linear-gradient(45deg,#17274d 0 10px,#101b38 10px 20px);box-shadow:0 0 calc(var(--tl,0)*1px) var(--rc),inset 0 0 20px rgba(0,0,0,.5)}
.face.bk svg{width:40%;filter:drop-shadow(0 0 8px rgba(242,182,50,.6))}
.slot:not(.flipped)[data-r="4"] .bk,.slot:not(.flipped)[data-r="5"] .bk{animation:tease 1s ease-in-out infinite alternate}
@keyframes tease{to{box-shadow:0 0 calc(var(--tl,0)*2.2px) var(--rc),inset 0 0 20px rgba(0,0,0,.5)}}
.spot{display:grid;justify-items:center;gap:6px;margin:16px 0 22px}
.spot .cardw{width:min(230px,62vw)}
.dealin{animation:dealin .5s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(min(var(--i),40)*.03s)}
@keyframes dealin{from{opacity:0;transform:translateY(22px) scale(.9)}}
.rays{position:absolute;left:50%;top:50%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc,#ffb02e) 55%,transparent) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 22%);mask-image:radial-gradient(circle,#000 0,transparent 22%)}
.rays.on{animation:raysin 2.2s ease-out forwards,spin 16s linear infinite}
@keyframes raysin{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.flashfx{position:fixed;inset:0;z-index:54;pointer-events:none;animation:flashfx .6s ease-out forwards}
@keyframes flashfx{0%{opacity:var(--a,.5)}100%{opacity:0}}
.shake{animation:shk .5s}
@keyframes shk{10%,50%,90%{transform:translate(-5px,2px)}30%,70%{transform:translate(5px,-2px)}}
#fx{position:fixed;inset:0;z-index:55;pointer-events:none}
.sum{text-align:center;color:var(--chalk-dim)}
.sum b{color:var(--chalk)}
.cnt{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font:500 13px var(--f-mono);margin:10px 0}

/* collection */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:16px 14px}
.tile{position:relative;background:none;border:0;padding:0;text-align:left}
.qty{position:absolute;top:-6px;right:-6px;z-index:3;background:var(--gold);color:var(--gold-ink);font:700 12px var(--f-mono);border-radius:999px;padding:2px 7px}
.fav{position:absolute;top:-6px;left:-6px;z-index:3;color:var(--gold);font-size:18px;text-shadow:0 1px 3px #000}
.bulk{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:16px;color:var(--chalk-dim);font-size:14px}
.empty{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--chalk-dim)}

/* market */
.mkt{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
@container (min-width:820px){.mkt{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}}
.mkt h3,.store h3.h{font:800 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}

const WV={coins:S.coins,gems:S.gems};
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function renderHeader(){
  ['coins','gems'].forEach(k=>{
    const el=$('#w-'+k),to=S[k],from=WV[k];
    if(from===to||REDUCE){WV[k]=to;el.textContent=fmt(to);return;}
    const pill=el.closest('.pill');
    if(to>from){pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump');}
    const t0=performance.now(),dur=Math.min(900,300+Math.abs(to-from)/20);
    cancelAnimationFrame(el._r);
    const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);WV[k]=p<1?Math.round(from+(to-from)*e):to;el.textContent=fmt(WV[k]);if(p<1)el._r=requestAnimationFrame(step);};
    el._r=requestAnimationFrame(step);
  });
  updateLuckChip();
}

function bulkCalc(maxIdx){

  return {n,total,uids};
}

function openPacks(k,n){
  const p=PACKS[k],items=[];let used=0,had=new Set(S.inv.map(i=>i.c));

    if(S.packs[k]>0)S.packs[k]--;

    used++;

  }
  if(!used)return;

  const best=items.reduce((a,b)=>(CAT[b.c].r>CAT[a.c].r||(CAT[b.c].r===CAT[a.c].r&&CAT[b.c].val>CAT[a.c].val))?b:a);

}

const FXC=$('#fx'),FXX=FXC.getContext('2d');let PT=[],PR=0;
function fxSize(){const d=Math.min(2,window.devicePixelRatio||1);FXC.width=innerWidth*d;FXC.height=innerHeight*d;FXC.style.width=innerWidth+'px';FXC.style.height=innerHeight+'px';FXX.setTransform(d,0,0,d,0,0);}

function burst(x,y,color,n,pw,kind){
  if(REDUCE)return;
  const conf=kind==='conf';
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.4,1)*pw;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(conf?pw*.6:0),life:1,dec:rnd(.012,.03),sz:rnd(2,6),c:Array.isArray(color)?pick(color):color,g:conf?.18:.08,rot:rnd(0,6),vr:rnd(-.3,.3),sq:conf});}
  if(!PR)PR=requestAnimationFrame(fxLoop);
}
function fxLoop(){
  FXX.clearRect(0,0,innerWidth,innerHeight);
  PT=PT.filter(p=>p.life>0);
  for(const p of PT){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;p.life-=p.dec;p.rot+=p.vr;FXX.globalAlpha=Math.max(0,p.life);FXX.fillStyle=p.c;
    if(p.sq){FXX.save();FXX.translate(p.x,p.y);FXX.rotate(p.rot);FXX.fillRect(-p.sz,-p.sz/2,p.sz*2,p.sz);FXX.restore();}
    else{FXX.beginPath();FXX.arc(p.x,p.y,Math.max(.5,p.sz*p.life),0,6.283);FXX.fill();}}
  FXX.globalAlpha=1;
  if(PT.length)PR=requestAnimationFrame(fxLoop);else{PR=0;FXX.clearRect(0,0,innerWidth,innerHeight);}
}

/* A friend code is a small snapshot of a collection: which players you own, which in foil, your name,
   and your trophies. It holds no coins or gems. Codes are typo-checked, not signed, so they can't be verified. */
const HEXN=Math.ceil(CAT.length/4),RPTS=[1,2,5,12,30,80],PID_RE=/^[a-z0-9]{8,12}$/,TAG_RE=/^[a-z0-9_-]{3,16}$/,MAXF=40;
const hdl=P=>'@'+(P.h||P.id);
const toHex=a=>{let h='';for(let i=0;i<CAT.length;i+=4)h+=(((a[i]||0)<<3)|((a[i+1]||0)<<2)|((a[i+2]||0)<<1)|(a[i+3]||0)).toString(16);return h;};
const fromHex=h=>{const a=new Uint8Array(CAT.length);for(let i=0;i<CAT.length;i++)a[i]=(parseInt(h[i>>2],16)>>(3-(i&3)))&1;return a;};
function myProfile(){
  const own=new Uint8Array(CAT.length),foil=new Uint8Array(CAT.length);
  S.inv.forEach(it=>{own[it.c]=1;if(it.f)foil[it.c]=1;});
  return {v:1,id:S.pid,h:S.tag,n:S.name,ts:Date.now(),o:S.opened,t:S.inv.length,b:toHex(own),f:toHex(foil),s:SPORTS.filter(x=>S.sets[x.id]).map(x=>x.id)};
}
function cleanProfile(o){
  if(!o||typeof o!=='object'||o.v!==1)return null;
  const int=(x,a,b)=>Number.isInteger(x)&&x>=a&&x<=b;
  if(typeof o.id!=='string'||!PID_RE.test(o.id))return null;
  const n=typeof o.n==='string'?o.n.replace(/[\u0000-\u001f\u007f<>]/g,'').trim().slice(0,16):'';
  if(!n||!int(o.ts,0,4e12)||!int(o.o,0,1e7)||!int(o.t,0,1e6))return null;
  const hex=new RegExp('^[0-9a-f]{'+HEXN+'}$');
  if(typeof o.b!=='string'||typeof o.f!=='string'||!hex.test(o.b)||!hex.test(o.f))return null;
  const own=fromHex(o.b),foil=fromHex(o.f);
  for(let i=0;i<CAT.length;i++)if(foil[i])own[i]=1;
  const h=typeof o.h==='string'&&TAG_RE.test(o.h)?o.h:'';
  const ids=SPORTS.map(x=>x.id),s=Array.isArray(o.s)?o.s.filter((x,i,a)=>ids.indexOf(x)>=0&&a.indexOf(x)===i):[];
  return {v:1,id:o.id,h,n,ts:o.ts,o:o.o,t:o.t,b:toHex(own),f:toHex(foil),s};
}
function pstats(P){
  const own=fromHex(P.b),foil=fromHex(P.f);let uniq=0,score=0,best=-1;
  for(let i=0;i<CAT.length;i++)if(own[i]){uniq++;const r=CAT[i].r;score+=Math.round(RPTS[r]*(foil[i]?1.5:1));if(r>best)best=r;}
  return {own,foil,uniq,score,best,pct:Math.round(uniq/CAT.length*100)};
}
function showcase(st,n){
  const ids=[];for(let i=0;i<CAT.length;i++)if(st.own[i])ids.push(i);
  ids.sort((a,b)=>CAT[b].r-CAT[a].r||st.foil[b]-st.foil[a]||CAT[b].ovr-CAT[a].ovr);return ids.slice(0,n);
}
const friendCode=P=>{const body=b64u(new TextEncoder().encode(JSON.stringify(P)));return 'PF1.'+body+'.'+hash8(body);};
function readFriendCode(text){
  const t=String(text).replace(/\s+/g,'');
  const m=/^PF1\.([A-Za-z0-9_-]+)\.([0-9a-f]{8})$/.exec(t);
  if(!m)return {err:/^PR[12]\./.test(t)?'That is a save code, not a friend code. Friend codes start with PF1.':'That does not look like a PackRush friend code.'};
  if(hash8(m[1])!==m[2])return {err:'The code is damaged. Check that you copied all of it.'};
  let o;try{o=JSON.parse(new TextDecoder().decode(unb64u(m[1])));}catch(e){return {err:'The code could not be read.'};}
  const p=cleanProfile(o);return p?{p}:{err:'That friend code is not valid.'};
}

/* ---------- live chat ---------- */
/* Chat reaches real people in up to three ways, with no sign-up needed for the default one.
   1. A free public relay (ntfy.sh): everyone who opens PackRush, on any site, shares one chat, and the last few hours
      are replayed for people who arrive later. Messages are public, and the relay sees visitors' network addresses.
   2. Firebase, only on a site whose owner has chosen to connect it (see the setup guide). It replaces the relay.
   3. The live room inside the claude.ai page, for whoever has that page open right now.
   Where none is reachable you can still type and see your own messages. */
const RELAY_URL='https://ntfy.sh/packrush-live-k7q2m9x4w8v3d6';
const CHAT={room:null,fs:null,rl:null,last:0,seen:new Map(),done:new Set(),lastName:'',warned:false,initing:false,ticks:0,backoff:0};

function chatStatus(){
  const el=$('#chatStat');if(!el)return;
  const F=CHAT.fs;
  if(F){
    if(F.err==='permission-denied'){el.textContent='Live chat is blocked by the database rules. The site owner needs to publish the latest rules from the setup guide. Retrying…';return;}
    if(F.err){el.textContent='Live chat cannot reach the database right now ('+F.err+'). Retrying…';return;}
    if(F.state!=='live'){el.textContent=Date.now()-F.t0>10000?'Still connecting. If this stays, the site owner should check that the Firestore database exists and its rules are published.':'Connecting to live chat…';return;}
    const now=Date.now(),names=Array.from(new Set(Array.from(F.recent.values()).filter(x=>x.uid!==F.uid&&now-x.t<600000).map(x=>x.n)));
    el.textContent='Live chat is on.'+(names.length?' Recently active: '+names.slice(0,4).join(', ')+(names.length>4?' +'+(names.length-4):''):' Say hello!');
    return;
  }
  const L=CHAT.rl;
  if(L&&L.state!=='dead'){
    if(L.state!=='live'){el.textContent='Connecting to live chat…';return;}
    const now=Date.now(),names=Array.from(new Set(Array.from(L.recent.values()).filter(x=>x.uid!==S.pid&&now-x.t<600000).map(x=>x.n)));
    el.textContent='Live chat is on. Everyone on PackRush shares it.'+(names.length?' Recently active: '+names.slice(0,4).join(', ')+(names.length>4?' +'+(names.length-4):''):' Say hello!');
    return;
  }
  const R=CHAT.room;
  if(R){
    if(!R.connected()){el.textContent='Connecting to live chat…';return;}
    const others=R.peers().filter(p=>!p.isMe&&p.kind==='viewer');
    if(!others.length){el.textContent='Live chat is on. Just you here right now.';return;}
    const names=Array.from(new Set(others.map(p=>cleanTxt(p.presence&&p.presence.n,16)||'Someone')));
    el.textContent='Here now: '+names.slice(0,4).join(', ')+(names.length>4?' +'+(names.length-4):'')+(others.length>names.length&&names.length<=4?' (and more tabs)':'');
    return;
  }
  if(fbEnabled()){
    el.textContent=FB.state==='error'&&!FB.api?'Live chat could not load. Check your connection.':'Connecting to live chat…';return;
  }
  el.textContent=L?'Live chat could not connect from here, so only you can see what you type. Retrying…':'Live chat is not connected here, so only you can see what you type.';
}

        warn(e&&e.code==='permission-denied'?'Your message could not be sent because the database rules do not allow chat yet. The site owner needs to publish the chat rules.':'Your message could not be sent. Check your connection.');
      });
    }catch(e){warn('Your message could not be sent.');}
  }else if(CHAT.rl&&CHAT.rl.state!=='dead'){
    fetch(RELAY_URL,{method:'POST',body:JSON.stringify({n:chatName(),t,u:S.pid})}).then(r=>{if(!r.ok)throw new Error(String(r.status));}).catch(e=>{
      warn(e&&/429/.test(e.message)?'Chat is busy right now. Wait a moment and try again.':'Your message could not be sent. Check your connection.');
    });
  }else if(R&&R.connected()){
    R.emit('chat',{n:chatName(),t}).catch(e=>{
      if(e&&e.code==='not_permitted')warn('You can read chat, but your access to this page is view-only, so others cannot see your messages. Ask the owner for contributor access.');
    });
  }else warn('Only you can see this message. Live chat connects when this page is open with other people who have access to it.');
  return true;
}
/* ---- transport 1: the site's Firebase database ---- */
function chatFbStop(){const F=CHAT.fs;if(F){clearTimeout(F.retry);if(F.unsub){try{F.unsub();}catch(e){}}}CHAT.fs=null;}
function chatFbAuth(u){
  if(!u){chatFbStop();chatStatus();return;}
  if(!FB.api)return;
  if(CHAT.fs&&CHAT.fs.uid===u.uid)return;
  chatFbStop();
  const Fs=FB.api.Fs,F={uid:u.uid,state:'connecting',err:'',first:true,recent:new Map(),unsub:null,retry:0,t0:Date.now()};
  CHAT.fs=F;
  const show=(id,d)=>{
    if(CHAT.done.has(id))return;CHAT.done.add(id);
    if(CHAT.done.size>600){const it=CHAT.done.values();for(let i=0;i<200;i++)CHAT.done.delete(it.next().value);}
    if(!d||typeof d!=='object')return;
    const t=cleanTxt(d.t,140),n=cleanTxt(d.n,16)||'Someone';if(!t)return;
    const ms=d.ts&&typeof d.ts.toMillis==='function'?d.ts.toMillis():Date.now();
    if(typeof d.uid==='string')F.recent.set(d.uid,{uid:d.uid,n,t:ms});
    if(d.uid===F.uid||d.uid===S.pid){if(F.first)say(n,t,'me');return;}
    if(!F.first){
      const now=Date.now(),r=CHAT.seen.get(d.uid)||{t:now,n:0};
      if(now-r.t>3000){r.t=now;r.n=0;}r.n++;CHAT.seen.set(d.uid,r);if(r.n>4)return;
    }
    say(n,t);if(!F.first)chatUnread();
  };
  const fail=e=>{
    F.err=(e&&e.code)||'error';F.state='error';
    if(F.unsub){try{F.unsub();}catch(x){}F.unsub=null;}
    chatStatus();
    /* A failed listener is dead, so start a fresh one after a pause that grows to 30 seconds. */
    CHAT.backoff=Math.min((CHAT.backoff||2000)*2,30000);
    F.retry=setTimeout(()=>{if(CHAT.fs===F){chatFbStop();chatFbAuth({uid:F.uid});}},CHAT.backoff);
  };
  try{
    const q=Fs.query(Fs.collection(FB.api.db,'chat'),Fs.orderBy('ts','desc'),Fs.limit(40));
    F.unsub=Fs.onSnapshot(q,{includeMetadataChanges:true},snap=>{
      F.err='';F.state=snap.metadata.fromCache?'connecting':'live';
      if(F.state==='live')CHAT.backoff=0;
      if(F.first){
        if(!snap.metadata.fromCache||snap.docs.length){
          snap.docs.slice().reverse().forEach(d=>show(d.id,d.data()));
          if(F.state==='live')F.first=false;
        }
      }else{
        snap.docChanges().filter(c=>c.type==='added').map(c=>c.doc).reverse().forEach(d=>show(d.id,d.data()));
      }
      chatStatus();
    },fail);
  }catch(e){fail(e);}
  chatStatus();
}
/* ---- transport 2: the free public relay (ntfy.sh), no sign-up ---- */
function relayDie(R){
  if(R.es){try{R.es.close();}catch(e){}R.es=null;}
  R.state='dead';R.deadAt=Date.now();chatStatus();
}
function relayStart(){
  if(CHAT.rl&&CHAT.rl.state!=='dead')return;
  if(typeof EventSource==='undefined'||typeof fetch!=='function')return;
  const R={state:'connecting',es:null,t0:Date.now(),first:true,everLive:false,recent:new Map(),lastId:'',deadAt:0};
  CHAT.rl=R;
  const show=(m,hist)=>{
    if(!m||typeof m!=='object'||(m.event&&m.event!=='message')||typeof m.message!=='string')return;
    if(typeof m.id==='string'){if(CHAT.done.has(m.id))return;CHAT.done.add(m.id);R.lastId=m.id;}
    if(CHAT.done.size>600){const it=CHAT.done.values();for(let i=0;i<200;i++)CHAT.done.delete(it.next().value);}
    let d;try{d=JSON.parse(m.message);}catch(e){return;}
    if(!d||typeof d!=='object')return;
    const t=cleanTxt(d.t,140),n=cleanTxt(d.n,16)||'Someone',u=typeof d.u==='string'?d.u.slice(0,40):'';if(!t||!u)return;
    const ms=(+m.time||0)*1000||Date.now();
    R.recent.set(u,{uid:u,n,t:ms});
    if(u===S.pid){if(hist)say(n,t,'me');return;}
    if(!hist){
      const now=Date.now(),r=CHAT.seen.get(u)||{t:now,n:0};
      if(now-r.t>3000){r.t=now;r.n=0;}r.n++;CHAT.seen.set(u,r);if(r.n>4)return;
    }
    say(n,t);if(!hist)chatUnread();
  };
  const lines=txt=>String(txt).split('\n').map(x=>{try{return JSON.parse(x);}catch(e){return null;}}).filter(Boolean);
  const catchup=()=>fetch(RELAY_URL+'/json?poll=1&since='+(R.lastId?encodeURIComponent(R.lastId):'3h')).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.text();}).then(txt=>{
    const ms=lines(txt).filter(m=>m.event==='message');
    (R.first?ms.slice(-40):ms).forEach(m=>show(m,R.first));
    R.first=false;
  });
  const connect=()=>{
    if(CHAT.rl!==R||R.state==='dead')return;
    const es=new EventSource(RELAY_URL+'/sse');
    R.es=es;
    es.onopen=()=>{
      const again=R.everLive;R.everLive=true;R.state='live';chatStatus();
      if(again)catchup().catch(()=>{});
    };
    es.onerror=()=>{if(R.state==='live')R.state='connecting';chatStatus();};
    es.onmessage=ev=>{try{show(JSON.parse(ev.data),false);}catch(e){}};
  };
  /* Fetching the recent history first doubles as the connection test: if it fails the relay is marked unavailable. */
  const ctl=typeof AbortController==='function'?new AbortController():null;
  const to=setTimeout(()=>{if(ctl)ctl.abort();},9000);
  catchup().then(()=>{clearTimeout(to);connect();}).catch(()=>{clearTimeout(to);relayDie(R);});
}
/* ---- transport 3: the claude.ai live room ---- */
function chatIncoming(m){
  if(!m||m.isMe)return;
  const d=m.data;if(!d||typeof d!=='object')return;
  const t=cleanTxt(d.t,140),n=cleanTxt(d.n,16)||'Someone';if(!t)return;
  const now=Date.now(),r=CHAT.seen.get(m.peer)||{t:now,n:0};
  if(now-r.t>3000){r.t=now;r.n=0;}
  r.n++;CHAT.seen.set(m.peer,r);if(r.n>4)return;
  say(n,t);chatUnread();
}
async function chatInit(){
  if(CHAT.initing)return;
  CHAT.initing=true;
  try{
    if(window.claude&&window.claude.use){
      const R=await window.claude.use('room');
      if(R){
        const lost=()=>{if(CHAT.room===R)CHAT.room=null;chatStatus();};
        CHAT.room=R;
        R.on('chat',chatIncoming,lost);
        R.onPeers(()=>chatStatus(),lost);
        R.onConnection(()=>chatStatus(),lost);
        chatPresence();
      }
    }
  }catch(e){CHAT.room=null;}
  CHAT.initing=false;
  if(!fbEnabled())relayStart();
  chatStatus();
}
function onChatSubmit(e){

  if(cmd==='!help'){inp.value='';sys('Commands: !luck shows your luck, !claim grabs a prize drop. Anything else is sent to the other people here.');return;}
  if(chatSend(t))inp.value='';
}

/* Owner setup: create a free Firebase project, turn on Google and Email/Password sign-in, create a Firestore
   database with the rules from the setup guide, then paste your web app settings below. Leave them empty to
   keep sign-in switched off. These values identify your project and are safe to publish; the Firestore rules
   are what keep each player's save private. */
const FIREBASE_CONFIG=/*FIREBASE_CONFIG*/{apiKey:'',authDomain:'',projectId:'',appId:''}/*END_FIREBASE_CONFIG*/;
const FB_VER='10.12.2';
const fbEnabled=()=>!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.authDomain&&FIREBASE_CONFIG.projectId);
const FB={state:'off',user:null,api:null,remoteTs:0,busy:false,synced:false,hash:'',msg:'',email:''};
const FBSYNC='packrush.fbsync';
function fbSyncGet(){try{return JSON.parse(localStorage.getItem(FBSYNC)||'null')||{};}catch(e){return {};}}
function fbSyncSet(uid,ts){try{localStorage.setItem(FBSYNC,JSON.stringify({uid,ts}));}catch(e){}}
function fbErr(e){
  const c=e&&e.code||'';
  const m={
   'auth/invalid-email':'That email address does not look right.',
   'auth/missing-email':'Enter your email address first.',
   'auth/user-not-found':'Wrong email or password.',
   'auth/wrong-password':'Wrong email or password.',
   'auth/invalid-credential':'Wrong email or password.',
   'auth/email-already-in-use':'An account with that email already exists. Try Sign in.',
   'auth/weak-password':'Use a password with at least 8 characters.',
   'auth/too-many-requests':'Too many tries. Wait a little and try again.',
   'auth/popup-blocked':'Your browser blocked the sign-in pop-up. Allow pop-ups for this site and try again.',
   'auth/popup-closed-by-user':'Sign-in was cancelled.',
   'auth/cancelled-popup-request':'Sign-in was cancelled.',
   'auth/unauthorized-domain':'This website is not on the allowed list in Firebase yet (Authentication, Settings, Authorized domains).',
   'auth/operation-not-allowed':'That sign-in method is not turned on in Firebase yet.',
   'auth/network-request-failed':'No connection. Check your internet and try again.',
   'permission-denied':'The database rules do not allow saving yet. The site owner needs to publish the Firestore rules.',
   'unavailable':'The save service is unreachable right now. Try again soon.'
  };
  return m[c]||'Something went wrong. Try again.';
}
async function fbInit(){
  if(!fbEnabled()){FB.state='off';return;}
  FB.state='loading';renderFb();
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
    const [A,Au,Fs]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app),db=Fs.getFirestore(app);
    FB.api={auth,db,Au,Fs};
    FB.t0=Date.now();
    Au.onAuthStateChanged(auth,u=>fbAuthChanged(u),()=>{FB.state='error';renderFb();chatFbAuth({uid:S.pid});});
  }catch(e){FB.state='error';FB.api=null;renderFb();}
}
/* Visitors who have not signed in get a nameless guest session, so live chat is connected at all times.
   It needs "Anonymous" turned on under Authentication, Sign-in method. Saves and accounts never use it. */
async function fbAnon(){
  if(!FB.api||FB.anonOff||(FB.anonTries||0)>=3)return false;
  FB.anonTries=(FB.anonTries||0)+1;
  try{await FB.api.Au.signInAnonymously(FB.api.auth);return true;}
  catch(e){if(e&&(e.code==='auth/operation-not-allowed'||e.code==='auth/admin-restricted-operation'))FB.anonOff=true;return false;}
}
async function fbAuthChanged(u){
  chatFbAuth(u?{uid:u.uid}:null);
  if(u)FB.anonTries=0;
  if(!u||u.isAnonymous){
    FB.user=null;FB.state='out';FB.synced=false;FB.remoteTs=0;FB.hash='';renderFb();
    /* No guest session possible (Anonymous sign-in is off, or it failed): chat still connects without one. */
    if(!u)fbAnon().then(ok=>{if(!ok)chatFbAuth({uid:S.pid});});
    return;
  }
  FB.user={uid:u.uid,email:u.email||'',name:u.displayName||''};FB.state='in';FB.msg='';
  if((!S.name||S.name==='You')&&FB.user.name){S.name=cleanTxt(FB.user.name.split(' ')[0],16)||S.name;save();}
  renderFb();
  try{
    const snap=await FB.api.Fs.getDoc(FB.api.Fs.doc(FB.api.db,'saves',u.uid));
    FB.remoteTs=snap.exists()?(+(snap.data()||{}).ts||0):0;
    const last=fbSyncGet();
    if(FB.remoteTs&&last.uid===u.uid&&last.ts===FB.remoteTs){FB.synced=true;FB.hash='';}
    else if(FB.remoteTs)FB.msg='Found a saved game from '+new Date(FB.remoteTs).toLocaleString()+'. Load it to continue where you left off, or save this device over it.';
    else FB.msg='No saved game on this account yet. Save this device\'s progress to start.';
  }catch(e){FB.msg=fbErr(e);}
  renderFb();
}
function renderFb(){
  const box=$('#fbBox');if(!box)return;
  const msg=FB.msg?'<p class="demo" role="status">'+esc(FB.msg)+'</p>':'';
  if(FB.state==='loading'){box.innerHTML='<p class="sub">Connecting to sign-in…</p>';return;}
  if(FB.state==='error'||!FB.api){box.innerHTML='<p class="sub">Sign-in could not load. Check your connection. Your progress is still saved on this device.</p>';return;}
  if(FB.state==='in'){

    box.innerHTML='<p class="sub">Signed in as <b>'+esc(FB.user.email||FB.user.name||'your account')+'</b>. '+(when?'Last saved to your account: '+esc(when)+'.':'No saved game on this account yet.')+'</p>'
     +'<div class="lst"><button class="btn gold" type="button" data-act="fbsave"'+(FB.remoteTs&&!FB.synced?' data-confirm="1"':'')+(FB.busy?' disabled':'')+'>Save progress to account</button>'

     +'<div class="lst"><button class="btn sm" type="button" data-act="fbsignout">Sign out</button></div>'+msg;
    return;
  }
  box.innerHTML='<p class="sub">Sign in so your progress follows you to any device.</p>'
   +'<div class="lst"><button class="btn gold" type="button" data-act="fbgoogle"'+(FB.busy?' disabled':'')+'>Continue with Google</button></div>'
   +'<p class="sub">Or use an email and password</p>'

   +'<input class="field-in" id="fbPw" type="password" autocomplete="current-password" placeholder="Password (8 or more characters)" aria-label="Password">'
   +'<div class="lst"><button class="btn gold" type="submit" data-mode="in"'+(FB.busy?' disabled':'')+'>Sign in</button><button class="btn" type="submit" data-mode="up"'+(FB.busy?' disabled':'')+'>Create account</button><button class="btn sm" type="button" data-act="fbreset">Forgot password</button></div></form>'
   +'<p class="demo">Pick a password just for PackRush. We never see your Google password.</p>'+msg;
}
async function fbRun(fn){

/* ---------- accounts: save code and cloud save ---------- */
const SAVE_KEYS=['name','coins','gems','packs','fav','luckUntil','luckMult','boostUntil','dailyAt','opened','best','starter','sets','walk','sound','pid','tag','friends'];
function packState(){
  const o={v:1};SAVE_KEYS.forEach(k=>{o[k]=S[k];});
  const m=new Map();S.inv.forEach(it=>{const k=it.c+(it.f?'F':'');m.set(k,(m.get(k)||0)+1);});
  o.inv=Array.from(m,([k,n])=>[parseInt(k,10),/F$/.test(k)?1:0,n]);
  o.lst=S.listings.map(l=>[l.c,l.f?1:0,l.price,l.t||0]);
  o.ts=Date.now();
  return o;
}
function validSave(o){
  const num=(x,a,b)=>typeof x==='number'&&isFinite(x)&&x>=a&&x<=b;
  if(!o||typeof o!=='object'||o.v!==1)return 'This is not a PackRush save.';
  if(!num(o.coins,0,1e12)||!num(o.gems,0,1e9))return 'The save has invalid coin or gem totals.';
  if(!Array.isArray(o.inv)||o.inv.length>5000)return 'The save has an invalid card list.';
  let total=0;
  for(const r of o.inv){
    if(!Array.isArray(r)||r.length!==3||!Number.isInteger(r[0])||r[0]<0||r[0]>=CAT.length||!(r[1]===0||r[1]===1)||!Number.isInteger(r[2])||r[2]<1)return 'The save has an unknown card.';
    total+=r[2];if(total>20000)return 'The save is too large.';
  }
  if(!o.packs||typeof o.packs!=='object')return 'The save is missing its packs.';
  for(const k of Object.keys(PACKS)){if(o.packs[k]!==undefined&&!num(o.packs[k],0,1e6))return 'The save has an invalid pack count.';}
  if(o.friends!==undefined&&(!Array.isArray(o.friends)||o.friends.length>MAXF*2))return 'The save has an invalid friends list.';
  const lst=o.lst||[];
  if(!Array.isArray(lst)||lst.length>12)return 'The save has invalid listings.';
  for(const l of lst){if(!Array.isArray(l)||!Number.isInteger(l[0])||l[0]<0||l[0]>=CAT.length||!num(l[2],1,1e12))return 'The save has an invalid listing.';}
  return '';
}
function applySave(o){
  const err=validSave(o);if(err)return err;
  const keep={adminPass:S.adminPass,adminLuck:S.adminLuck,freePacks:S.freePacks,priceMult:S.priceMult,cloudAuto:S.cloudAuto};
  const f=newState(),n=(x,d)=>typeof x==='number'&&isFinite(x)?x:d;
  f.name=String(o.name||'You').slice(0,16);
  f.coins=Math.floor(o.coins);f.gems=Math.floor(o.gems);
  Object.keys(PACKS).forEach(k=>{f.packs[k]=Math.floor(n(o.packs[k],0));});
  f.fav={};if(o.fav&&typeof o.fav==='object')Object.keys(o.fav).forEach(k=>{if(/^\d{1,3}F?$/.test(k))f.fav[k]=1;});
  f.luckUntil=n(o.luckUntil,0);f.luckMult=n(o.luckMult,3);f.boostUntil=n(o.boostUntil,0);f.dailyAt=n(o.dailyAt,0);
  f.opened=Math.floor(n(o.opened,0));f.best=Math.floor(n(o.best,-1));f.starter=!!o.starter;f.walk=o.walk!==false;f.sound=o.sound!==false;
  f.sets={};if(o.sets&&typeof o.sets==='object')SPORTS.forEach(s=>{if(o.sets[s.id])f.sets[s.id]=1;});
  f.inv=[];let u=1;o.inv.forEach(r=>{for(let i=0;i<r[2];i++)f.inv.push({u:u++,c:r[0],f:!!r[1]});});
  f.listings=(o.lst||[]).map(l=>{const id=u++;return {id:'M'+id,u:id,c:l[0],f:!!l[1],price:Math.floor(l[2]),t:n(l[3],0)};});
  f.uid=u+1;
  f.pid=PID_RE.test(String(o.pid||''))?o.pid:S.pid;
  f.tag=TAG_RE.test(String(o.tag||''))?o.tag:'';
  f.friends=(Array.isArray(o.friends)?o.friends:[]).map(cleanProfile).filter(x=>x&&x.id!==f.pid).slice(0,MAXF);
  Object.assign(f,keep);
  Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,f);
  save();renderHeader();renderSound();renderStage();
  return '';
}
const b64u=bytes=>{let s='';bytes.forEach(b=>{s+=String.fromCharCode(b);});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64u=str=>{str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';return Uint8Array.from(atob(str),ch=>ch.charCodeAt(0));};
function hash8(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(16).padStart(8,'0');}
async function makeCode(){
  const raw=new TextEncoder().encode(JSON.stringify(packState()));
  let tag='PR1',bytes=raw;
  if(window.CompressionStream){try{bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer());tag='PR2';}catch(e){bytes=raw;tag='PR1';}}
  const body=b64u(bytes);return tag+'.'+body+'.'+hash8(body);
}
async function readCode(code){
  const m=/^(PR[12])\.([A-Za-z0-9_-]+)\.([0-9a-f]{8})$/.exec(String(code).replace(/\s+/g,''));
  if(!m)return {err:'That does not look like a PackRush save code.'};
  if(hash8(m[2])!==m[3])return {err:'The code is damaged. Check that you copied all of it.'};
  try{
    let bytes=unb64u(m[2]);
    if(m[1]==='PR2')bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    return {obj:JSON.parse(new TextDecoder().decode(bytes))};
  }catch(e){return {err:'The code could not be read.'};}
}
const stateHash=()=>{const o=packState();o.ts=0;return hash8(JSON.stringify(o));};

let CLOUD={state:'unknown',ref:null,name:'',msg:'',remoteTs:0,busy:false,synced:false,hash:''};
function cloudErr(e){const c=e&&e.code;if(c==='invalid_argument')return 'This account can view the page but is not allowed to save to it.';if(c==='quota_exceeded')return 'The page storage is full.';if(c==='resource_exhausted')return 'Too many requests. Try again in a minute.';return 'Cloud save is unavailable right now. Try again later.';}
async function cloudInit(){
  try{
    if(!(window.claude&&window.claude.use)){CLOUD.state='off';renderAccount();return;}
    const db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user){CLOUD.state='off';renderAccount();return;}
    const me=await user.me();
    if(!me||!me.id){CLOUD.state='off';renderAccount();return;}
    CLOUD.ref=db.doc('data/users/'+me.id+'/progress');CLOUD.name=me.name||'';CLOUD.state='ready';
    const snap=await CLOUD.ref.get();
    if(snap.exists){CLOUD.remoteTs=+((snap.data()||{}).ts)||0;}
  }catch(e){if(CLOUD.state!=='ready')CLOUD.state='off';}
  renderAccount();
}
async function cloudSave(){
  if(!CLOUD.ref||CLOUD.busy)return;
  CLOUD.busy=true;CLOUD.msg='';renderAccount();
  try{
    const code=await makeCode(),ts=Date.now();
    await CLOUD.ref.set({code,ts});
    CLOUD.remoteTs=ts;CLOUD.synced=true;CLOUD.hash=stateHash();CLOUD.msg='Saved to your account.';
  }catch(e){CLOUD.msg=cloudErr(e);if(e&&e.code==='invalid_argument')CLOUD.state='readonly';}
  CLOUD.busy=false;renderAccount();
}
async function cloudLoad(){
  if(!CLOUD.ref||CLOUD.busy)return;
  CLOUD.busy=true;CLOUD.msg='';renderAccount();
  try{
    const snap=await CLOUD.ref.get();
    if(!snap.exists)CLOUD.msg='No cloud save found.';
    else{const r=await readCode(String((snap.data()||{}).code||''));if(r.err)CLOUD.msg=r.err;else{const err=applySave(r.obj);if(err)CLOUD.msg=err;else{CLOUD.synced=true;CLOUD.hash=stateHash();CLOUD.msg='Loaded your cloud save.';}}}
  }catch(e){CLOUD.msg=cloudErr(e);}
  CLOUD.busy=false;renderAccount();
}

   +(CLOUD.msg?'<p class="demo">'+esc(CLOUD.msg)+'</p>':'');

async function restoreCode(){
  const v=($('#codeIn')||{}).value||'',m=$('#codeMsg');if(!m)return;
  if(!v.trim()){m.textContent='Paste a save code first.';return;}
  const r=await readCode(v);if(r.err){m.textContent=r.err;return;}
  const err=applySave(r.obj);m.textContent=err||'Restored. Welcome back, '+S.name+'.';
  if(!err){toast('Progress restored.');sfx('win');}
}
document.addEventListener('submit',e=>{
  if(e.target.id==='tagForm'){e.preventDefault();saveTag();return;}
  if(e.target.id!=='nameForm')return;
  e.preventDefault();S.name=($('#nameIn').value.trim()||'You').slice(0,16);save();toast('Name saved: '+S.name);
});
document.addEventListener('change',e=>{
  if(e.target.id!=='cloudAuto')return;
  if(e.target.checked&&!CLOUD.synced){e.target.checked=false;CLOUD.msg='Press Save to cloud or Load cloud save once first, so auto-save cannot overwrite a newer save.';renderAccount();return;}
  S.cloudAuto=e.target.checked;save();
});
setInterval(()=>{if(S.cloudAuto&&CLOUD.state==='ready'&&CLOUD.synced&&!CLOUD.busy&&stateHash()!==CLOUD.hash)cloudSave();},20000);

/* ---------- boot ---------- */
refreshListings();
renderHeader();renderSound();renderStage();updateEventBox();updateGiveaway();tkAdd('Welcome to PackRush. Pack odds are live.');
sys('Welcome to <b>PackRush</b>. Chat, events and prize drops show up here. Type !help for commands.');
cloudInit();chatInit();fbInit();
setInterval(tick,1000);
window.addEventListener('beforeunload',save);
})();
</script></body></html>
